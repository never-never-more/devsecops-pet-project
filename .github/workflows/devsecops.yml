name: DevSecOps Security Pipeline

# Запускаем пайплайн каждый раз при git push в ветку main или master
on:
  push:
    branches: ["main", "master"]

permissions: 
  contents: read
  packages: write

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      # 1 скачиваем код с сервера github
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 1.5 запускаем сканер утечек секретов Gitleaks
      - name: Run Gitleaks Secret Scanner
        run: |
          docker run --rm -v $(pwd):/path zricethezav/gitleaks:latest detect --source="/path" --verbose

      # 2 запускаем Bandit
      - name: Run Bandit SAST
        run: |
          pip install Bandit
          bandit -r app.py
    
      # 3 собираем Docker образ
      - name: Build Docker image
        run:  docker build -t devsecops-agent:latest .

      # 4 запускаем Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-agent:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy IaC (Kubernates) scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s-deployment.yaml'
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Login in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to Registry
        run: |
            IMAGE_TAG=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' [:lower:])
            docker tag devsecops-agent:latest $IMAGE_TAG
            docker push $IMAGE_TAG
      
      - name: Run Integration Test (Send Telegram Alert)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          docker run --rm \
            -e TG_BOT_TOKEN="$TG_BOT_TOKEN" \
            -e TG_CHAT_ID="$TG_CHAT_ID" \
            devsecops-agent:latest
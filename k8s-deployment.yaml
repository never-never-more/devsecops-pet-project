apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-agent-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent-container
        image: devsecops-agent:latest
        securityContext:
          privileged: false
          runAsNonRoot: true
          ranAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
